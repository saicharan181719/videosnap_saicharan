<!DOCTYPE html>

<html>

<head>

    <title>Cart</title>

    {% load static %}

    <link rel="stylesheet" href="{% static 'products/style.css' %}">

</head>

<body>

<div class="container">

    <h1>My Cart</h1>

    <table>

        <tr>

            <th>Image</th>

            <th>Product</th>

            <th>Price</th>

            <th>Quantity</th>

            <th>Total</th>

        </tr>

        {% for item in items %}

        <tr>

            <td>

                <img src="{{ item.product.image.url }}" width="100">

            </td>

            <td>

                {{ item.product.name }}

            </td>

            <td>

                ₹{{ item.product.price }}

            </td>

            <td>

                {{ item.quantity }}

            </td>

            <td>

                ₹{{ item.total_price }}

            </td>

        </tr>

        {% empty %}

        <tr>

            <td colspan="5">

                Cart is Empty

            </td>

        </tr>

        {% endfor %}

    </table>

    <h2>

        Grand Total : ₹{{ total }}

    </h2>

    <br>

    <a href="{% url 'products' %}" class="view">

        Continue Shopping

    </a>

</div>

</body>

</html>
