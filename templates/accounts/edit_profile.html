<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f3f2ef;
        }

        .container{
            width:600px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.1);
        }

        h1{
            text-align:center;
            margin-bottom:25px;
        }

        label{
            display:block;
            margin-top:15px;
            margin-bottom:5px;
            font-weight:bold;
        }

        input[type="text"],
        textarea{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        textarea{
            height:120px;
            resize:none;
        }

        input[type="file"]{
            margin-top:10px;
        }

        .preview{
            width:120px;
            height:120px;
            border-radius:50%;
            object-fit:cover;
            margin:15px auto;
            display:block;
            border:2px solid #ddd;
        }

        button{
            width:100%;
            margin-top:25px;
            padding:12px;
            border:none;
            background:#0A66C2;
            color:white;
            font-size:16px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#004182;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Edit Profile</h1>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {% if profile.profile_picture %}
            <img src="{{ profile.profile_picture.url }}" class="preview">
        {% endif %}

        <label>Profile Picture</label>
        <input
            type="file"
            name="profile_picture">

        <label>About</label>
        <textarea
            name="about">{{ profile.about }}</textarea>

        <label>City</label>
        <input
            type="text"
            name="city"
            value="{{ profile.city }}">

        <label>District</label>
        <input
            type="text"
            name="district"
            value="{{ profile.district }}">

        <label>State</label>
        <input
            type="text"
            name="state"
            value="{{ profile.state }}">

        <button type="submit">
            Save Changes
        </button>

    </form>

</div>

</body>

</html>
