<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:380px;
            background:white;
            padding:35px;
            border-radius:10px;
            box-shadow:0 5px 20px rgba(0,0,0,0.15);
            text-align:center;
        }

        h1{
            color:#1f2937;
            margin-bottom:15px;
        }

        p{
            color:#666;
            margin-bottom:25px;
            line-height:1.5;
        }

        label{
            display:block;
            text-align:left;
            margin-bottom:8px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            margin-bottom:20px;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:6px;
            background:#2563eb;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        .links{
            margin-top:20px;
        }

        .links a{
            text-decoration:none;
            color:#2563eb;
        }

        .links a:hover{
            text-decoration:underline;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Forgot Password</h1>

    <p>
        Enter your registered email address below.
        We'll send you instructions to reset your password.
    </p>

    <form action="#" method="post">

        <label>Email Address</label>

        <input
            type="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">
            Send Reset Link
        </button>

    </form>

    <div class="links">

        <p>
            Remember your password?
            <a href="login.html">Login</a>
        </p>

    </div>

</div>

</body>
</html>
