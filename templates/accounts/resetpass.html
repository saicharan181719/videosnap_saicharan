<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:400px;
            background:white;
            padding:35px;
            border-radius:10px;
            box-shadow:0 5px 20px rgba(0,0,0,0.15);
        }

        h1{
            text-align:center;
            color:#1f2937;
            margin-bottom:15px;
        }

        p{
            text-align:center;
            color:#666;
            margin-bottom:25px;
            line-height:1.5;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:6px;
            margin-bottom:20px;
        }

        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#1d4ed8;
        }

        .links{
            text-align:center;
            margin-top:20px;
        }

        .links a{
            text-decoration:none;
            color:#2563eb;
        }

        .links a:hover{
            text-decoration:underline;
        }

    </style>

</head>
<body>

<div class="container">

    <h1>Reset Password</h1>

    <p>
        Create a new password for your account.
        Make sure it is strong and easy for you to remember.
    </p>

    <form action="#" method="post">

        <label for="password">New Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter new password"
            required
        >

        <label for="confirm_password">Confirm Password</label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            placeholder="Confirm new password"
            required
        >

        <button type="submit">
            Save Password
        </button>

    </form>

    <div class="links">
        <p>
            <a href="login.html">Back to Login</a>
        </p>
    </div>

</div>

</body>
</html>
